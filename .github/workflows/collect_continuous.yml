name: collect-live
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      backfill_from:
        description: "Backfill start date (YYYY-MM-DD UTC). Loops 6h windows through backfill_to and uploads them all as one live-jsonl artifact. Normal shifted collection is skipped."
        required: false
        default: ""
      backfill_to:
        description: "Backfill end date (YYYY-MM-DD UTC, inclusive). NewsAPI serves ~30 days back — older dates return nothing."
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: collect-live
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
      SHIFT_MINUTES: 1440
      # 360 (STEP 4, 2026-08-05): GitHub cron regularly skips/delays runs under
      # load; with a 180-min window any gap >3h lost articles permanently.
      # Windows already overlap by design (dedup downstream), so widening is safe.
      RECENT_MINUTES: 360
      MAX_PAGES: 10
      QUERY: >-
        (inflation OR fed OR tariff OR recession OR gdp OR cpi OR rates)
        OR (earnings OR revenue OR profit OR ipo OR merger OR acquisition)
        OR (trump OR china OR iran OR russia OR ukraine OR nato OR sanctions)
        OR (nvidia OR apple OR microsoft OR tesla OR amazon OR google)
        OR (oil OR energy OR dollar OR treasury OR bond OR crypto OR bitcoin)
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Ensure dirs
        run: |
          mkdir -p data/live_newsapi
      - name: Collect shifted window
        id: collect
        if: env.NEWSAPI_KEY != '' && github.event.inputs.backfill_from == ''
        shell: bash
        run: |
          set -euo pipefail
          TO_EPOCH=$(date -u -d "${SHIFT_MINUTES} minutes ago" +%s)
          FROM_EPOCH=$(( TO_EPOCH - ${RECENT_MINUTES}*60 ))
          FROM=$(date -u -d "@${FROM_EPOCH}" +%FT%TZ)
          TO=$(date -u -d "@${TO_EPOCH}" +%FT%TZ)
          YEAR=$(date -u -d "@${TO_EPOCH}" +%Y)
          MONTH=$(date -u -d "@${TO_EPOCH}" +%m)
          DAY=$(date -u -d "@${TO_EPOCH}" +%d)
          STAMP=$(date -u -d "@${TO_EPOCH}" +%Y-%m-%dT%H-%MZ)
          OUTDIR="data/live_newsapi/${YEAR}/${MONTH}/${DAY}"
          mkdir -p "${OUTDIR}"
          OUT="${OUTDIR}/${STAMP}.jsonl"
          TMP="${OUT}.tmp"
          export FROM_ISO="${FROM}"
          export TO_ISO="${TO}"
          export OUTFILE_TMP="${TMP}"
          export QUERY="${QUERY}"
          export MAX_PAGES="${MAX_PAGES}"
          export NEWSAPI_KEY="${NEWSAPI_KEY}"
          python scripts/collect_shifted.py
          BYTES=0
          if [ -f "${TMP}" ]; then BYTES=$(wc -c < "${TMP}" || echo 0); fi
          if [ "${BYTES}" -gt 0 ]; then
            mv "${TMP}" "${OUT}"
            echo "outfile=${OUT}" >> "$GITHUB_OUTPUT"
            echo "bytes=${BYTES}"  >> "$GITHUB_OUTPUT"
          else
            rm -f "${TMP}"
            echo "outfile=" >> "$GITHUB_OUTPUT"
            echo "bytes=0"  >> "$GITHUB_OUTPUT"
            # A 6-hour window of global finance news is never actually empty —
            # 0 bytes means the API call failed (expired/rate-limited key is
            # swallowed by collect_shifted's bare except). Fail RED instead of
            # shipping a green no-op that starves the warehouse for days.
            echo "::error::collect returned 0 articles for ${FROM} → ${TO}. NEWSAPI_KEY expired/rate-limited or API down."
            exit 1
          fi
      - name: Backfill window range
        id: backfill
        if: env.NEWSAPI_KEY != '' && github.event.inputs.backfill_from != ''
        shell: bash
        run: |
          set -euo pipefail
          START="${{ github.event.inputs.backfill_from }}"
          END="${{ github.event.inputs.backfill_to }}"
          for D in "$START" "$END"; do
            if ! [[ "$D" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error title=Bad date input::'$D' is not YYYY-MM-DD"
              exit 1
            fi
          done
          if [ "$(date -u -d "$START" +%s)" -gt "$(date -u -d "$END" +%s)" ]; then
            echo "::error::backfill_from $START is after backfill_to $END"
            exit 1
          fi
          OUTDIR="backfill_out"
          mkdir -p "$OUTDIR"
          export QUERY MAX_PAGES NEWSAPI_KEY
          TOTAL_FILES=0
          D="$START"
          while [ "$(date -u -d "$D" +%s)" -le "$(date -u -d "$END" +%s)" ]; do
            for H in 00 06 12 18; do
              FROM="${D}T${H}:00:00Z"
              TO=$(date -u -d "${D} ${H}:00:00 UTC + 6 hours" +%FT%TZ)
              OUT="${OUTDIR}/${D}T${H}-00Z.jsonl"
              TMP="${OUT}.tmp"
              FROM_ISO="$FROM" TO_ISO="$TO" OUTFILE_TMP="$TMP" python scripts/collect_shifted.py
              if [ -s "$TMP" ]; then
                mv "$TMP" "$OUT"
                TOTAL_FILES=$((TOTAL_FILES+1))
                echo "collected $(wc -l < "$OUT") articles for ${FROM} → ${TO}"
              else
                rm -f "$TMP"
                echo "::warning::0 articles for ${FROM} → ${TO} (outside NewsAPI lookback, or API error)"
              fi
              sleep 2
            done
            D=$(date -u -d "$D + 1 day" +%F)
          done
          echo "backfill files: $TOTAL_FILES"
          if [ "$TOTAL_FILES" -eq 0 ]; then
            echo "::error::backfill collected 0 files for $START → $END"
            exit 1
          fi
      - name: Fail when NEWSAPI_KEY secret is missing
        if: env.NEWSAPI_KEY == ''
        run: |
          echo "::error::NEWSAPI_KEY secret is empty — collection silently skipped. Restore the secret."
          exit 1
      - name: Upload artifact
        if: ${{ steps.collect.outputs.outfile != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: live-jsonl
          path: ${{ steps.collect.outputs.outfile }}
          if-no-files-found: warn
          # 7 (2026-09-04): with 2-day retention the 2026-08-27→09-02 outage
          # expired every raw slice before recovery — 7 days of articles
          # unrecoverable from artifacts. A week survives a long weekend outage.
          retention-days: 7
      - name: Upload backfill artifact
        if: ${{ steps.backfill.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: live-jsonl
          path: backfill_out/*.jsonl
          if-no-files-found: error
          retention-days: 7