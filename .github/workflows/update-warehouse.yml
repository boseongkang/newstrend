name: update-warehouse
on:
  workflow_dispatch:
    inputs:
      backfill:
        description: "Regenerate every daily CSV from master.jsonl (--multi-day)"
        type: boolean
        default: false
      allow_empty_start:
        description: "DANGER: proceed even when no previous warehouse artifact was restored (fresh start / deliberate reset)"
        type: boolean
        default: false
  schedule:
    - cron: "23 * * * *"

concurrency:
  group: update-warehouse
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt

      - name: Download previous warehouse artifact
        uses: dawidd6/action-download-artifact@v17
        with:
          workflow: update-warehouse.yml
          name: warehouse
          path: prev_warehouse
          if_no_artifact_found: ignore

      - name: Restore previous warehouse
        run: |
          set -euo pipefail
          mkdir -p data/warehouse/daily
          SRC=prev_warehouse
          if [ -d prev_warehouse/warehouse ]; then SRC=prev_warehouse/warehouse; fi
          if [ -d "$SRC" ]; then rsync -a "$SRC"/ data/warehouse/; fi

      - name: Floor check — refuse to run on an empty/vanished warehouse
        # The warehouse exists ONLY as a run-to-run artifact chain. If the
        # previous artifact expired or a broken run uploaded a near-empty one,
        # this run would rebuild from a few hours of live files and upload a
        # tiny warehouse — silently resetting months of history. Fail RED
        # instead; a deliberate fresh start needs allow_empty_start=true.
        run: |
          set -euo pipefail
          PREV_MASTER_LINES=$(wc -l < data/warehouse/master.jsonl 2>/dev/null || echo 0)
          PREV_DAILY_FILES=$(ls data/warehouse/daily 2>/dev/null | wc -l | tr -d ' ')
          echo "restored warehouse: master.jsonl=${PREV_MASTER_LINES} lines, daily files=${PREV_DAILY_FILES}"
          echo "PREV_MASTER_LINES=${PREV_MASTER_LINES}" >> "$GITHUB_ENV"
          echo "PREV_DAILY_FILES=${PREV_DAILY_FILES}"   >> "$GITHUB_ENV"
          if [ "${PREV_MASTER_LINES}" -lt 1000 ] && [ "${{ github.event.inputs.allow_empty_start }}" != "true" ]; then
            echo "::error::warehouse floor check FAILED — restored master.jsonl has ${PREV_MASTER_LINES} lines (<1000). Previous artifact missing/expired/corrupt. Refusing to overwrite history; re-run with allow_empty_start=true only for a deliberate reset."
            exit 1
          fi

      - name: Download latest live jsonl
        uses: dawidd6/action-download-artifact@v17
        with:
          workflow: collect_continuous.yml
          name: live-jsonl
          path: live_artifacts
          if_no_artifact_found: ignore

      - name: Download RSS jsonl
        uses: dawidd6/action-download-artifact@v17
        with:
          workflow: collect_rss.yml
          name: rss-jsonl
          path: rss_artifacts
          if_no_artifact_found: ignore

      - name: Restore live inputs (NewsAPI + RSS merged)
        run: |
          set -euo pipefail
          mkdir -p data/live_newsapi

          # NewsAPI artifacts
          find live_artifacts -type f -name "*.jsonl" -exec cp {} data/live_newsapi/ \; 2>/dev/null || true

          # RSS artifacts — merge into same date files
          python3 - <<'PY2'
          import glob, json, os
          from pathlib import Path

          rss_dir  = "rss_artifacts"
          out_dir  = "data/live_newsapi"
          seen     = set()

          for src in sorted(glob.glob(f"{rss_dir}/**/*.jsonl", recursive=True) +
                            glob.glob(f"{rss_dir}/*.jsonl")):
              date = Path(src).stem[:10]  # YYYY-MM-DD
              dest = f"{out_dir}/{date}.jsonl"

              # 기존 NewsAPI 파일의 article ID 수집 (중복 방지)
              if os.path.exists(dest):
                  with open(dest) as f:
                      for line in f:
                          try:
                              obj = json.loads(line)
                              aid = obj.get("id") or obj.get("url","")
                              if aid: seen.add(aid)
                          except: pass

              # RSS 기사 추가 (중복 제외)
              added = 0
              with open(src) as f_in, open(dest, "a") as f_out:
                  for line in f_in:
                      try:
                          obj = json.loads(line.strip())
                          aid = obj.get("id") or obj.get("url","")
                          if aid and aid not in seen:
                              seen.add(aid)
                              f_out.write(json.dumps(obj, ensure_ascii=False) + "\n")
                              added += 1
                      except: pass
              if added:
                  print(f"  RSS merged {date}: +{added} articles")
          PY2

          echo "live_newsapi contents:"
          ls -lh data/live_newsapi/ | tail -8
          wc -l data/live_newsapi/*.jsonl 2>/dev/null | tail -5 || true

      - name: Update corpus
        run: |
          set -euo pipefail
          python scripts/update_corpus.py

      - name: Merge Live to Daily JSONL (Raw Data)
        shell: bash
        run: |
          python - <<'PY'
          import glob, os, re

          live_dir = "data/live_newsapi"
          warehouse_dir = "data/warehouse/daily"
          os.makedirs(warehouse_dir, exist_ok=True)

          files = sorted(glob.glob(os.path.join(live_dir, "*.jsonl")))
          
          for f in files:
              fname = os.path.basename(f)
              match = re.match(r"(\d{4}-\d{2}-\d{2})", fname)
              if match:
                  date_str = match.group(1)
                  dest = os.path.join(warehouse_dir, f"{date_str}.jsonl")
                  
                  with open(f, "r", encoding="utf-8") as infile:
                      content = infile.read()
                  
                  with open(dest, "a", encoding="utf-8") as outfile:
                      if content.strip():
                          outfile.write(content)
                          if not content.endswith("\n"):
                              outfile.write("\n")
                  print(f"Merged raw data: {fname} -> {dest}")
          PY

      - name: Extract terms to daily CSV (incremental)
        if: ${{ github.event.inputs.backfill != 'true' }}
        run: |
          set -euo pipefail
          DT="$(date -u +%F)"
          python scripts/extract_terms.py \
            --inputs "data/live_newsapi/*.jsonl" "data/warehouse/daily/${DT}.jsonl" "data/warehouse/master.jsonl" \
            --outcsv "data/warehouse/daily/${DT}.csv" \
            --date "$DT" \
            --date-filter "$DT" \
            --topk 800 --minlen 2 --mincount 2 \
            --max-ngram 1 \
            --stop config/stopwords_en.txt

      - name: Extract terms to daily CSVs (backfill — multi-day from master)
        if: ${{ github.event.inputs.backfill == 'true' }}
        run: |
          set -euo pipefail
          # Drop stale per-day token derivatives so they don't shadow the new CSV.
          rm -f data/warehouse/daily/*_tokens.csv data/warehouse/daily/*_tokens.jsonl
          python scripts/extract_terms.py \
            --inputs "data/warehouse/master.jsonl" \
            --multi-day \
            --outdir "data/warehouse/daily" \
            --topk 800 --minlen 2 --mincount 2 \
            --max-ngram 1 \
            --stop config/stopwords_en.txt
          echo "=== Daily CSVs after backfill ==="
          ls data/warehouse/daily/*.csv | wc -l
          ls -lt data/warehouse/daily/*.csv | head -10 || true


      - name: Shrink check — never upload a warehouse smaller than restored
        # master.jsonl is append-only and daily files only accumulate; any
        # shrink means this run corrupted the merge. Failing here skips the
        # upload, so the previous (good) artifact stays the newest.
        run: |
          set -euo pipefail
          NOW_MASTER_LINES=$(wc -l < data/warehouse/master.jsonl 2>/dev/null || echo 0)
          NOW_DAILY_FILES=$(ls data/warehouse/daily 2>/dev/null | wc -l | tr -d ' ')
          echo "outgoing warehouse: master.jsonl=${NOW_MASTER_LINES} lines (prev ${PREV_MASTER_LINES}), daily files=${NOW_DAILY_FILES} (prev ${PREV_DAILY_FILES})"
          if [ "${NOW_MASTER_LINES}" -lt "${PREV_MASTER_LINES}" ]; then
            echo "::error::warehouse shrink check FAILED — master.jsonl ${PREV_MASTER_LINES} → ${NOW_MASTER_LINES} lines. Skipping upload to protect the previous artifact."
            exit 1
          fi
          # backfill deliberately deletes *_tokens.* derivatives, so compare
          # daily-file count only on normal incremental runs
          if [ "${{ github.event.inputs.backfill }}" != "true" ] && [ "${NOW_DAILY_FILES}" -lt "${PREV_DAILY_FILES}" ]; then
            echo "::error::warehouse shrink check FAILED — daily files ${PREV_DAILY_FILES} → ${NOW_DAILY_FILES}. Skipping upload."
            exit 1
          fi

      - name: Upload warehouse artifact
        uses: actions/upload-artifact@v6
        with:
          name: warehouse
          path: |
            data/warehouse/master.jsonl
            data/warehouse/daily