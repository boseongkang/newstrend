name: archive-daily

on:
  schedule:
    - cron: "8 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: archive-daily
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - id: when
        # D-2, not yesterday: with SHIFT_MINUTES=1440 day D's warehouse file
        # keeps growing through D+1, so D-1 is still incomplete at 00:08 UTC.
        # D-2 is the freshest COMPLETE day (same rule as trend-site archiving).
        shell: bash
        run: |
          if date -u -d "2 days ago" +%F >/dev/null 2>&1; then
            echo "date=$(date -u -d '2 days ago' +%F)" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u -v-2d +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Download latest warehouse artifact
        id: dlwh
        uses: dawidd6/action-download-artifact@v17
        with:
          workflow: update-warehouse.yml
          workflow_conclusion: success
          branch: main
          path: artifacts
          if_no_artifact_found: warn

      - id: find
        shell: bash
        run: |
          set -euo pipefail
          D="${{ steps.when.outputs.date }}"
          mkdir -p out
          FOUND=""
          if [ -d artifacts ]; then
            # upload-artifact strips the common parent (data/warehouse), and
            # dawidd6 nests by artifact name, so the real layout is
            # artifacts/warehouse/daily/D.jsonl — the old pattern
            # "*/data/warehouse/daily/…" never matched, silently sending every
            # release through the single-batch live fallback.
            FOUND=$(find artifacts -type f -path "*/daily/${D}.jsonl" -print -quit || true)
          fi
          if [ -n "$FOUND" ]; then
            cp -v "$FOUND" "out/news_${D}.jsonl"
            echo "from=warehouse" >> "$GITHUB_OUTPUT"
            echo "path=out/news_${D}.jsonl" >> "$GITHUB_OUTPUT"
          fi

      - name: Download latest live artifact (fallback)
        if: ${{ steps.find.outputs.from != 'warehouse' }}
        uses: dawidd6/action-download-artifact@v17
        with:
          workflow: collect_continuous.yml
          workflow_conclusion: success
          branch: main
          path: live_art
          if_no_artifact_found: warn

      - name: Build daily from live (fallback)
        if: ${{ steps.find.outputs.from != 'warehouse' }}
        shell: bash
        env:
          D: ${{ steps.when.outputs.date }}
        run: |
          set -euo pipefail
          mkdir -p out
          python - << 'PY'
          import json, os, glob
          D = os.environ["D"]
          out = f"out/news_{D}.jsonl"
          cnt = skipped = 0
          with open(out, "w", encoding="utf-8") as w:
            for p in sorted(glob.glob("live_art/**/*.jsonl", recursive=True)):
              with open(p, "r", encoding="utf-8") as r:
                for line in r:
                  if not line.strip():
                    continue
                  # keep only articles actually published on D — the latest
                  # live batch spans other days (SHIFT window), and an
                  # unfiltered dump mislabels them as day D
                  try:
                    if not str(json.loads(line).get("publishedAt", "")).startswith(D):
                      skipped += 1
                      continue
                  except Exception:
                    skipped += 1
                    continue
                  w.write(line)
                  cnt += 1
          print(f"written {cnt} lines for {D} (skipped {skipped} off-date/bad)")
          PY

      - id: verify
        shell: bash
        run: |
          set -euo pipefail
          D="${{ steps.when.outputs.date }}"
          test -s "out/news_${D}.jsonl"

      - name: Gzip
        shell: bash
        run: |
          D="${{ steps.when.outputs.date }}"
          gzip -9 -f "out/news_${D}.jsonl"
          ls -lh out

      - name: Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: snap-${{ steps.when.outputs.date }}
          name: snap-${{ steps.when.outputs.date }}
          body: Daily snapshot (UTC) for ${{ steps.when.outputs.date }}.
          files: |
            out/news_${{ steps.when.outputs.date }}.jsonl.gz
          draft: false
          prerelease: false
          make_latest: false
          fail_on_unmatched_files: true
          append_body: false
          generate_release_notes: false
          allowUpdates: true
