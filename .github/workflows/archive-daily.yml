name: archive-daily

on:
  schedule:
    - cron: "8 0 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Archive this UTC date (YYYY-MM-DD) from the warehouse instead of D-2 — manual recovery path for a missed day"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: archive-daily
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: when
        # D-2, not yesterday: with SHIFT_MINUTES=1440 day D's warehouse file
        # keeps growing through D+1, so D-1 is still incomplete at 00:08 UTC.
        # D-2 is the freshest COMPLETE day (same rule as trend-site archiving).
        # A workflow_dispatch `date` input overrides D-2: this run archives
        # only once per day, so a RED day is a permanent gap unless it can be
        # replayed from the warehouse (e.g. 2026-08-10, lost on 2026-08-12).
        shell: bash
        run: |
          set -euo pipefail
          REQ="${{ inputs.date }}"
          if [ -n "$REQ" ]; then
            if ! [[ "$REQ" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error title=Bad date input::'$REQ' is not YYYY-MM-DD"
              exit 1
            fi
            echo "date=$REQ" >> "$GITHUB_OUTPUT"
          elif date -u -d "2 days ago" +%F >/dev/null 2>&1; then
            echo "date=$(date -u -d '2 days ago' +%F)" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u -v-2d +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Get latest warehouse run id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Same hardening as trend-site (a79200443): `gh run list`
          # intermittently returns a stale list — on 2026-08-12 the "latest"
          # warehouse artifact predated 2026-08-10, the old live fallback
          # produced 0 articles, and the day was permanently lost. Sort by
          # createdAt ourselves, require the pick to be <12h old
          # (update-warehouse runs hourly), retry, fail loud.
          FLOOR=$(date -u -d "12 hours ago" +%Y-%m-%dT%H:%M:%SZ)
          RID="" CREATED=""
          for i in 1 2 3 4 5; do
            read -r RID CREATED < <(gh run list --workflow update-warehouse.yml \
              --branch main --status success --limit 20 \
              --json databaseId,createdAt \
              --jq 'sort_by(.createdAt) | last | "\(.databaseId) \(.createdAt)"') || true
            if [ -n "${RID:-}" ] && [ "$CREATED" \> "$FLOOR" ]; then
              break
            fi
            echo "attempt $i: stale/empty run list (RID=${RID:-none} created=${CREATED:-none}, floor=$FLOOR) — retrying"
            RID="" CREATED=""
            sleep 15
          done
          if [ -z "$RID" ]; then
            echo "::error title=Stale run list::gh run list kept returning update-warehouse runs older than $FLOOR after 5 attempts"
            exit 1
          fi
          echo "picked update-warehouse run $RID (created $CREATED)"
          echo "RUN_ID=$RID" >> $GITHUB_ENV

      - name: Download warehouse artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh run download "$RUN_ID" -n warehouse -D artifacts

      - id: find
        shell: bash
        run: |
          set -euo pipefail
          D="${{ steps.when.outputs.date }}"
          mkdir -p out
          if ls artifacts/*.zip >/dev/null 2>&1; then unzip -o artifacts/*.zip -d artifacts >/dev/null; fi
          if [ -f artifacts/artifact.tar ]; then tar -xf artifacts/artifact.tar -C artifacts; fi
          FOUND=$(find artifacts -type f -path "*daily/${D}.jsonl" -print -quit || true)
          # No live fallback: a fresh (<12h) warehouse artifact missing day D
          # means the day is genuinely absent upstream — the single latest
          # live batch can't reconstruct it (98 articles, all off-date, on
          # 2026-08-12), so a quiet fallback just publishes an empty/wrong
          # snapshot. Fail RED and recover via workflow_dispatch date=D later.
          if [ -z "$FOUND" ]; then
            echo "::error title=Day missing from warehouse::daily/${D}.jsonl not in warehouse artifact of run $RUN_ID"
            exit 1
          fi
          cp -v "$FOUND" "out/news_${D}.jsonl"

      - id: verify
        shell: bash
        run: |
          set -euo pipefail
          D="${{ steps.when.outputs.date }}"
          test -s "out/news_${D}.jsonl"

      - name: Gzip
        shell: bash
        run: |
          D="${{ steps.when.outputs.date }}"
          gzip -9 -f "out/news_${D}.jsonl"
          ls -lh out

      - name: Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: snap-${{ steps.when.outputs.date }}
          name: snap-${{ steps.when.outputs.date }}
          body: Daily snapshot (UTC) for ${{ steps.when.outputs.date }}.
          files: |
            out/news_${{ steps.when.outputs.date }}.jsonl.gz
          draft: false
          prerelease: false
          make_latest: false
          fail_on_unmatched_files: true
          append_body: false
          generate_release_notes: false
          # replaces same-name assets on re-run — keeps the dispatch
          # recovery path idempotent (allowUpdates was a ncipollo-ism
          # softprops never accepted)
          overwrite_files: true
